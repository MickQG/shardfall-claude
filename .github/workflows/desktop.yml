name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths: ['desktop/**', 'package.json', 'package-lock.json', '.github/workflows/desktop.yml', 'src/**', 'public/**', 'index.html', 'vite.config.ts']

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # DSK-4: the shell starts, loads the game from app://shardfall and the simulation runs.
      - name: Smoke test the desktop shell
        run: npx playwright test tests/e2e/desktop.spec.ts
        env:
          DESKTOP_E2E: '1'
      - name: Package (portable exe and installer)
        run: npx electron-builder --win --publish never
      # DSK-4 again, against the packaged executable.
      - name: Smoke test the packaged app
        run: npx playwright test tests/e2e/desktop.spec.ts
        env:
          DESKTOP_E2E: '1'
          SHARDFALL_EXE: ${{ github.workspace }}\release\win-unpacked\Shardfall.exe
      - uses: actions/upload-artifact@v4
        with:
          name: shardfall-windows
          path: |
            release/*.exe
          if-no-files-found: error
      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release create "${{ github.ref_name }}" release/*.exe --title "Shardfall ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
