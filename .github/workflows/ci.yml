name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: CI only checks the code (SEC-4).
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three kinds of job run in parallel: static checks and unit tests, the AI harness (one job per map) and the browser
# tests (split into shards), so the slowest single job sets the wall-clock time instead of their sum.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Shipped dependencies must have no known high or critical vulnerabilities (SEC-4).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run trace
      - run: npm run bench

  harness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        map: [crossroads, riverbed, highlands]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run harness -- 2 ${{ matrix.map }}

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser download is cached per Playwright version; system libraries are installed every time (fast).
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report

  # One required check that passes only when every job above passed.
  verify:
    runs-on: ubuntu-latest
    needs: [checks, harness, e2e]
    if: always()
    steps:
      - run: test "${{ needs.checks.result }}" = success && test "${{ needs.harness.result }}" = success && test "${{ needs.e2e.result }}" = success
