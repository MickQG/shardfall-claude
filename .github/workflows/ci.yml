name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: CI only checks the code (SEC-4).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Shipped dependencies must have no known high or critical vulnerabilities (SEC-4).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run trace
      - run: npm run bench
      - run: npm run harness
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
