name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: CI only checks the code (SEC-4).
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three kinds of job run in parallel: static checks and fast unit tests, full AI-vs-AI matches (one job per map or test
# file) and the browser tests (split into shards), so the slowest single job sets the wall-clock time instead of their
# sum. Full matches take minutes, so a pull request runs them only when it changes what they test (#107).
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matches: ${{ steps.f.outputs.matches }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # A pull request is checked out as its merge commit: its first parent is the base branch, so the diff is the PR.
      - id: f
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "matches=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(src/(sim|ai|data)/|tests/matches/|scripts/harness|package(-lock)?\.json$|vitest\.matches|\.github/workflows/)'; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Shipped dependencies must have no known high or critical vulnerabilities (SEC-4).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run trace
      - run: npm run bench

  matches:
    needs: changes
    if: needs.changes.outputs.matches == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: harness crossroads, run: npm run harness -- 2 crossroads }
          - { name: harness riverbed, run: npm run harness -- 2 riverbed }
          - { name: harness highlands, run: npm run harness -- 2 highlands }
          - { name: faction balance, run: npm run test:matches -- faction-balance }
          - { name: difficulty, run: npm run test:matches -- difficulty }
          - { name: raider, run: npm run test:matches -- personalities -t AI-14 }
          - { name: doomsday, run: npm run test:matches -- personalities -t AI-15 }
    name: matches (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser download is cached per Playwright version; system libraries are installed every time (fast).
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report

  # One required check that passes only when every job above passed.
  verify:
    runs-on: ubuntu-latest
    needs: [checks, changes, matches, e2e]
    if: always()
    steps:
      # Full matches may be skipped (the pull request does not touch what they test), never failed.
      - run: test "${{ needs.checks.result }}" = success && test "${{ needs.changes.result }}" = success && test "${{ needs.e2e.result }}" = success && (test "${{ needs.matches.result }}" = success || test "${{ needs.matches.result }}" = skipped)
